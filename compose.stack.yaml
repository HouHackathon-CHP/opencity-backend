# Use with: docker compose -f ../dxos-core/compose.yaml -f compose.stack.yaml up --build -d
services:
  gateway:
    environment:
      EXTRA_UPSTREAMS: '{"opencity":"http://opencity-backend:8000"}'
    depends_on:
      - opencity-backend

  opencity-backend:
    build: ../opencity-backend
    environment:
      DATA_URL: http://data:8000
      WORKFLOW_URL: http://workflow:8000
      INTERNAL_GATEWAY_SECRET: ${INTERNAL_GATEWAY_SECRET:?Create .env from dxos-core/.env.example}
      NEWS_DB_PATH: /service/data/bulletins.sqlite3
      SURVEY_DB_PATH: /service/data/surveys.sqlite3
      REPORT_DB_PATH: /service/data/report-routing.sqlite3
    depends_on:
      - data
      - workflow
    volumes:
      - opencity-bulletins:/service/data

volumes:
  opencity-bulletins:
