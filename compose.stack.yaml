# SPDX-License-Identifier: Apache-2.0
# Use with: docker compose -f ../dxos-core/compose.yaml -f compose.stack.yaml up --build -d
services:
  gateway:
    environment:
      EXTRA_UPSTREAMS: '{"opencity":"http://opencity-backend:8000"}'
      PUBLIC_GET_ROUTES: >-
        {"opencity":{"tenant":"demo","paths":["bulletins","bulletins/{id}","hotlines","air-quality/summary","air-quality/stations","air-quality/stations/{id}","bus/routes","bus/routes/{id}","bus/stops","bus/stops/{id}","bus/find","bus/audit"]}}
    depends_on:
      - opencity-backend

  opencity-backend:
    build: ../opencity-backend
    environment:
      DATA_URL: http://data:8000
      WORKFLOW_URL: http://workflow:8000
      INSIGHT_URL: http://insight:8000
      INTERNAL_GATEWAY_SECRET: ${INTERNAL_GATEWAY_SECRET:?Create .env from dxos-core/.env.example}
      NEWS_DB_PATH: /service/data/bulletins.sqlite3
      SURVEY_DB_PATH: /service/data/surveys.sqlite3
      REPORT_DB_PATH: /service/data/report-routing.sqlite3
      APPOINTMENT_DB_PATH: /service/data/appointments.sqlite3
      ADMIN_FEEDBACK_DB_PATH: /service/data/administrative-feedback.sqlite3
      AIR_QUALITY_DB_PATH: /service/data/air-quality.sqlite3
      WAQI_API_TOKEN: ${WAQI_API_TOKEN:-}
      BUSINESS_FEEDBACK_DB_PATH: /service/data/business-feedback.sqlite3
      HOTLINES_DB_PATH: /service/data/hotlines.sqlite3
      COMMUNITY_DB_PATH: /service/data/community.sqlite3
      SOCIAL_FEEDBACK_DB_PATH: /service/data/social-feedback.sqlite3
      DIGITAL_WARD_DB_PATH: /service/data/digital-ward.sqlite3
      BUS_SEARCH_DB_PATH: /service/data/bus-search.sqlite3
      OSM_OVERPASS_URL: ${OSM_OVERPASS_URL:-https://overpass-api.de/api/interpreter}
    depends_on:
      - data
      - workflow
      - insight
    volumes:
      - opencity-bulletins:/service/data

volumes:
  opencity-bulletins:
